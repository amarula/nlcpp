job build:
  shell:
    - cmake -B build -D CMAKE_CXX_COMPILER=g++ -D CMAKE_CXX_FLAGS="-Werror -Wno-deprecated-declarations"
    - cmake --build build
  artifact test-tool:
    path: build/nlcpp-test-tool

job clang:
  shell:
    - cmake -B build -D CMAKE_CXX_COMPILER=clang++ -D CMAKE_CXX_FLAGS="-Werror -Wno-deprecated-declarations"
    - cmake --build build

job test:
  uses:
    - build.test-tool
  shell:
    - erebos-tester --verbose
