job build:
  shell:
    - cmake -B build -D CMAKE_CXX_COMPILER=g++ -D CMAKE_CXX_FLAGS="-Werror -Wno-deprecated-declarations"
    - cmake --build build
  artifact test-tool:
    path: build/nlcpp-test-tool
  artifact library-soname:
    path: build/libnlcpp.so.<0->.<0->
  artifact library-full:
    path: build/libnlcpp.so.<0->.<0->.*

job clang:
  shell:
    - cmake -B build -D CMAKE_CXX_COMPILER=clang++ -D CMAKE_CXX_FLAGS="-Werror -Wno-deprecated-declarations"
    - cmake --build build

job test:
  uses:
    - build.test-tool
    - build.library-soname
    - build.library-full
  shell:
    - LD_LIBRARY_PATH="$(realpath build)" erebos-tester --verbose
